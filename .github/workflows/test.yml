name: Tests

# Fast and green by design (4.2.9). Three Linux checks that finish in about a
# minute each, one macOS gate (scripts/ci-gate.sh, the same script the release
# job runs) and the native LanceDB lane. The full suite runs once, locally,
# before each release; on shared runners its timing and process tests measured
# the runner, not SLM, and no full-suite job had finished green in weeks.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit on the same PR or branch supersedes the older run; without
  # this, superseded runs and duplicate push runs queued for hours.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Import contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install "import-linter==2.15"
      - name: Import contracts
        run: PYTHONPATH=src lint-imports
  # The plugin folders (plugin/, cursor-plugin/, codex-plugin/, copilot-plugin/,
  # antigravity-plugin/, hermes-plugin/, muse-plugin/, vscode-agent-plugin/ ...)
  # are generated from plugin-src/ but tracked, because hosts install them
  # straight from git. A source change without a rebuild once shipped stale
  # launcher copies; rebuilding here and requiring a clean tree stops that.
  plugin-drift:
    name: Generated plugins match their sources
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: "22"
      - name: Rebuild every plugin
        run: node scripts/build-all-plugins.mjs
      - name: Fail on any difference from the committed copies
        shell: bash
        run: |
          set -euo pipefail
          # Only the generated plugin trees: the build does not own docs/ assets,
          # and binary files there (demo GIFs) differ on every checkout.
          paths=(plugin codex-plugin copilot-plugin cursor-plugin antigravity-plugin
                 muse-plugin hermes-plugin vscode-agent-plugin
                 .claude-plugin .cursor-plugin .github/plugin)
          if ! git diff --exit-code --stat -- "${paths[@]}"; then
            echo "::error::Generated plugin files are out of date. Run 'node scripts/build-all-plugins.mjs' and commit the result."
            git diff -- "${paths[@]}" | head -n 200
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=all -- "${paths[@]}")"
          if [ -n "$untracked" ]; then
            echo "::error::The plugin build created files that are not committed:"
            echo "$untracked"
            exit 1
          fi

  security:
    name: Dependency and static security gates
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8
      - name: Audit locked runtime dependencies
        shell: bash
        run: |
          # --locked: audit the committed lock; fail if it no longer matches pyproject.
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file /tmp/slm-runtime-requirements.txt
          # GHSA-8mgp-746c-j5xp (nltk, no patched release): SLM never calls the
          # affected model-file APIs or enables nltk pathsec; llmlingua uses only
          # nltk.sent_tokenize. See docs/security/dependency-audit-exceptions.md.
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement /tmp/slm-runtime-requirements.txt \
            --no-deps --disable-pip \
            --ignore-vuln GHSA-8mgp-746c-j5xp
      - name: Reject high-confidence high-severity Python findings
        run: uvx --from bandit==1.8.6 bandit -r src/superlocalmemory -q -lll -iii

  gate:
    name: Release-contract gate (macOS)
    runs-on: macos-14
    # uv-managed Python only: the runner's python.org build cannot load
    # SQLite extensions, and uv prefers a system Python when it finds one.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # uv-managed Python: python.org builds cannot load SQLite extensions,
      # so sqlite-vec never loads and doctor, media and document tests fail.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: "22"
      - name: Install libomp (required by lightgbm)
        run: brew install libomp
      - name: Install the locked environment
        run: |
          uv sync --frozen --python 3.12
          npm ci --ignore-scripts
      - name: Release-contract gate
        run: uv run bash scripts/ci-gate.sh

  native-lancedb:
    name: Native LanceDB (macOS)
    runs-on: macos-14
    # uv-managed Python only: the runner's python.org build cannot load
    # SQLite extensions, and uv prefers a system Python when it finds one.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8
      - name: Install native backend test environment
        run: uv sync --frozen --python 3.12 --extra lancedb
      - name: Run LanceDB in a dedicated process lane
        run: uv run python -m pytest -q -m native tests/vector
