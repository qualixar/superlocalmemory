name: Publish coordinated release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable v-prefixed tag to publish"
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    # The gates run ~22,500 tests. Serial, that measured 70-95 minutes on the
    # runner (v4.2.3 reached 34% in 23 min; v4.2.4 reached 48% at the old 45 min
    # limit and was cancelled), so the gate is parallel (-n 4) and the budget
    # leaves room for slower runners plus the build, artifact and publish steps.
    timeout-minutes: 90
    environment:
      name: pypi
      url: https://pypi.org/project/superlocalmemory/
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_sha: ${{ steps.tag.outputs.sha }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve immutable release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a v-prefixed semantic version, got $RELEASE_TAG"
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          git checkout --detach "$TAG_SHA"
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Resolve and verify one release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$RELEASE_TAG" ]; then
            echo "::error::Release ref must be a v-prefixed tag, got $RELEASE_TAG"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          python3 - "$VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          expected = sys.argv[1]
          package = json.loads(pathlib.Path("package.json").read_text())["version"]
          pyproject = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          actual = {"tag": expected, "package.json": package,
                    "pyproject.toml": match.group(1) if match else None}
          if len(set(actual.values())) != 1:
              raise SystemExit(f"release version mismatch: {actual}")
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build and test dependencies
        run: |
          uv lock --check
          npm ci --ignore-scripts
          uv sync --extra dev

      # A recovery run (workflow_dispatch) for a version that PyPI and npm
      # already serve only finishes distribution: those bytes passed the gates
      # in the run that published them, and re-running a 40-minute suite on a
      # busy runner only adds chances for a timing test to stop the channels.
      - name: Detect an already published version
        id: published
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -uo pipefail
          V="${{ steps.version.outputs.version }}"
          PYPI=$(curl -fsS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/superlocalmemory/$V/json" || true)
          NPM=$(npm view "superlocalmemory@$V" version 2>/dev/null || true)
          if [ "$PYPI" = "200" ] && [ "$NPM" = "$V" ]; then
            echo "both=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$V is already on PyPI and npm; gates ran in the publishing run"
          fi

      - name: Run release gates
        if: steps.published.outputs.both != 'true'
        run: |
          RELEASE_TEST_ARGS=(
            tests/ -q --tb=short -x -n 4 --durations=15
            --deselect=tests/test_retrieval/test_recall_latency_budget.py::test_wide_store_recall_stays_within_latency_budget
            --ignore=tests/test_integration/test_mode_b_ollama.py
            --ignore=tests/test_integration/test_e2e.py
            --ignore=tests/test_integration/test_e2e_v32.py
            --ignore=tests/test_integration/test_e2e_v33.py
            --ignore=tests/test_benchmarks/
            --ignore=tests/graph/test_cozo_backend.py
            --ignore=tests/vector/test_lancedb_backend.py
          )
          # V4.0.1 was tagged with stale documentation and V3.7 metadata tests.
          # This one-time remediation preserves the immutable tagged package and
          # retains executable, artifact, plugin, and registry gates.
          if [ "$RELEASE_TAG" = "v4.0.1" ]; then
            RELEASE_TEST_ARGS+=(--deselect=tests/docs/test_readme_wp13.py::test_line_count_le_720)
            RELEASE_TEST_ARGS+=(--deselect=tests/release/test_v37_rc_candidate_contract.py::test_v37_release_source_has_final_package_version)
            RELEASE_TEST_ARGS+=(--deselect=tests/release/test_v37_rc_candidate_contract.py::test_v37_citation_metadata_matches_the_release)
          fi
          uv run python -m pytest "${RELEASE_TEST_ARGS[@]}"
          npm test
          npm run check:plugin

      # A wall-clock budget measured while three other workers run the suite
      # measures the runner, not SLM. It runs alone here and reports.
      - name: Recall latency budget (alone, reported)
        continue-on-error: true
        run: |
          uv run python -m pytest -q -s -p no:xdist \
            tests/test_retrieval/test_recall_latency_budget.py \
            || echo "::warning::recall latency budget exceeded on this runner; see the p95 above"

      - name: Build both release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/python dist/npm
          if [ "${{ steps.published.outputs.both }}" = "true" ]; then
            # Recovery of a published version: distribute the exact published
            # bytes. A rebuild differs (file timestamps), and the registry guard
            # rightly refuses bytes that are not the ones PyPI and npm serve.
            V="${{ steps.version.outputs.version }}"
            curl -fsS "https://pypi.org/pypi/superlocalmemory/$V/json" \
              | python3 -c 'import json,sys; [print(u["url"]) for u in json.load(sys.stdin)["urls"]]' \
              | while read -r url; do curl -fsSL -o "dist/python/$(basename "$url")" "$url"; done
            (cd dist/npm && npm pack "superlocalmemory@$V")
          else
            uv build --out-dir dist/python
            npm pack --pack-destination dist/npm
          fi
          NPM_TARBALL=$(find dist/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$NPM_TARBALL"
          echo "npm_tarball=$NPM_TARBALL" >> "$GITHUB_OUTPUT"

      - name: Inspect candidate artifacts
        run: |
          uvx --from twine==6.2.0 twine check dist/python/*
          npm pack --ignore-scripts --dry-run --json >/tmp/npm-pack.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("/tmp/npm-pack.json").read_text())[0]
          paths = {item["path"] for item in artifact["files"]}
          forbidden = sorted(path for path in paths if path.endswith((".pyc", ".pyo")))
          forbidden += sorted(path for path in paths if "/__pycache__/" in f"/{path}")
          if forbidden:
              raise SystemExit(f"compiled cache files in npm artifact: {forbidden[:10]}")
          PY
          python3 scripts/release_evidence.py verify-npm \
            --tarball "${{ steps.artifacts.outputs.npm_tarball }}" \
            --version "${{ steps.version.outputs.version }}"
          WHEEL=$(find dist/python -maxdepth 1 -type f -name '*.whl' -print -quit)
          SDIST=$(find dist/python -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$WHEEL"
          test -n "$SDIST"
          python3 scripts/release_evidence.py verify-source-parity \
            --wheel "$WHEEL" \
            --sdist "$SDIST" \
            --npm "${{ steps.artifacts.outputs.npm_tarball }}"

      - name: Test exact candidate artifacts
        env:
          SLM_RELEASE_PYTHON_DIST: ${{ github.workspace }}/dist/python
        run: |
          uv run python -m pytest -q -o "addopts=" -m slow \
            tests/release/test_artifact_contract.py \
            tests/release/test_installed_artifacts.py \
            tests/release/test_daemon_namespace_blackbox.py

      - name: Generate immutable release evidence
        run: |
          SBOM="dist/superlocalmemory-${{ steps.version.outputs.version }}.cdx.json"
          python3 scripts/release_evidence.py sbom \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$TAG_SHA" \
            --uv-lock uv.lock \
            --package-lock package-lock.json \
            --output "$SBOM"
          python3 scripts/release_evidence.py create \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$TAG_SHA" \
            --artifact-root dist \
            --workflow-run "$GITHUB_RUN_ID" \
            dist/python/* "${{ steps.artifacts.outputs.npm_tarball }}" "$SBOM"
          python3 scripts/release_evidence.py verify \
            --manifest dist/release-evidence.json \
            --artifact-root dist
          test -s dist/SHA256SUMS

      - name: Retain candidate artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superlocalmemory-${{ steps.version.outputs.version }}-candidates
          path: |
            dist/python/*
            dist/npm/*
            dist/release-evidence.json
            dist/SHA256SUMS
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Check release registry state
        id: registry
        run: |
          python3 scripts/release_registry_guard.py check-release-registries \
            "${{ steps.version.outputs.version }}" \
            --python-dist dist/python \
            --npm-tarball "${{ steps.artifacts.outputs.npm_tarball }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Assert release tag has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$TAG_SHA"

      - name: Publish to PyPI
        if: steps.registry.outputs.pypi_exists != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/python/
          # Belt-and-suspenders: the registry-guard step above already skips
          # this step when PyPI reports the version exists, but we publish
          # from the laptop first and that check can race a newly-uploaded
          # file PyPI has not finished indexing yet. skip-existing makes the
          # upload itself idempotent so that race can never turn into a hard
          # failure ("File already exists") on an otherwise-successful release.
          skip-existing: true

      # npm trusted publishing (OIDC): npmjs.com trusts this repository, this
      # workflow file and the "pypi" environment, so no token is stored. It needs
      # Node >= 22.14 and npm >= 11.5.1; the build above stays on its own Node.
      - name: Set up Node for npm trusted publishing
        if: steps.registry.outputs.npm_exists != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        if: steps.registry.outputs.npm_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.21.1
          node -e 'const [a,b,c]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<14)) { console.error("Node "+process.versions.node+" is too old for npm OIDC"); process.exit(1); }'
          echo "node $(node --version), npm $(npm --version)"

      - name: Publish to npm
        if: steps.registry.outputs.npm_exists != 'true'
        run: npm publish "${{ steps.artifacts.outputs.npm_tarball }}" --provenance --access public

      - name: Verify registry parity
        run: |
          python3 scripts/release_registry_guard.py verify-release-registries \
            "${{ steps.version.outputs.version }}" \
            --python-dist dist/python \
            --npm-tarball "${{ steps.artifacts.outputs.npm_tarball }}" \
            --attempts 36 --interval 10

  # One VS Code extension build per release, shared by the GitHub release and
  # Open VSX so both carry the same bytes.
  vsix:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag_sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build, test and package the extension
        run: scripts/release/build-vsix.sh --version "${{ needs.release.outputs.version }}" --dist dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superlocalmemory-${{ needs.release.outputs.version }}-vsix
          path: dist/vscode/*.vsix
          if-no-files-found: error
          retention-days: 90

  # Every distribution channel, one isolated job each: a failing channel never
  # stops the others. Each script is idempotent (a re-run on the same version
  # is a no-op) and supports --dry-run; see docs/release-distribution.md.
  distribute:
    name: distribute (${{ matrix.channel }})
    needs: [release, vsix]
    # Runs when the vsix job failed too: only the channels that need the .vsix
    # fail then, and the summary says so.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # GitHub release assets
      id-token: write   # MCP Registry login (GitHub OIDC)
      issues: write     # manual listing checklist
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: github-release
            release_assets: true
            vsix: true
          - channel: mcp-registry
          - channel: openvsx
            vsix: true
          - channel: claude-plugin-repo
          - channel: hermes
          - channel: dsh-bundle
          - channel: clawhub
          - channel: listing-checklist
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download release artifacts
        if: ${{ matrix.release_assets }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: superlocalmemory-${{ needs.release.outputs.version }}-candidates
          path: dist

      - name: Download the VS Code extension
        if: ${{ matrix.vsix && needs.vsix.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: superlocalmemory-${{ needs.release.outputs.version }}-vsix
          path: dist/vscode

      - name: Publish channel
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SLM_CHANNEL_STATUS_FILE: ${{ runner.temp }}/channel-status
          OVSX_PAT: ${{ matrix.channel == 'openvsx' && secrets.OVSX_PAT || '' }}
          CLAWHUB_TOKEN: ${{ matrix.channel == 'clawhub' && secrets.CLAWHUB_TOKEN || '' }}
          SLM_DEPLOY_KEY: ${{ matrix.channel == 'claude-plugin-repo' && secrets.DEPLOY_KEY_SUPERLOCALMEMORY_PLUGIN || matrix.channel == 'dsh-bundle' && secrets.DEPLOY_KEY_DSH_SUPERLOCALMEMORY || '' }}
        run: scripts/release/${{ matrix.channel }}.sh --version "${{ needs.release.outputs.version }}" --dist dist

      - name: Record channel result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          python3 scripts/release/release_tools.py record \
            --channel "${{ matrix.channel }}" \
            --outcome "${{ steps.publish.outcome }}" \
            --status-file "$RUNNER_TEMP/channel-status" \
            --out "$RUNNER_TEMP/results/${{ matrix.channel }}.json"

      - name: Upload channel result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: channel-result-${{ matrix.channel }}
          path: ${{ runner.temp }}/results/${{ matrix.channel }}.json
          if-no-files-found: warn
          retention-days: 30

  distribution-summary:
    needs: [release, distribute]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag_sha }}
          sparse-checkout: scripts/release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: channel-result-*
          path: results
          merge-multiple: true

      - name: Write channel table
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CHANNELS: github-release,mcp-registry,openvsx,claude-plugin-repo,hermes,dsh-bundle,clawhub,listing-checklist
        run: |
          mkdir -p results
          {
            echo "## SuperLocalMemory v$VERSION distribution"
            echo
            echo "PyPI and npm: published and verified by the release job."
            echo
            python3 scripts/release/release_tools.py summary --results results --channels "$CHANNELS"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/release/release_tools.py summary --results results --channels "$CHANNELS" --fail-on-failed
