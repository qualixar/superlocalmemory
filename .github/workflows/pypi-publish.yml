name: Publish coordinated release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable v-prefixed tag to publish"
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: pypi
      url: https://pypi.org/project/superlocalmemory/
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a v-prefixed semantic version, got $RELEASE_TAG"
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          git checkout --detach "$TAG_SHA"
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          echo "TAG_SHA=$TAG_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Resolve and verify one release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$RELEASE_TAG" ]; then
            echo "::error::Release ref must be a v-prefixed tag, got $RELEASE_TAG"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          python3 - "$VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          expected = sys.argv[1]
          package = json.loads(pathlib.Path("package.json").read_text())["version"]
          pyproject = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          actual = {"tag": expected, "package.json": package,
                    "pyproject.toml": match.group(1) if match else None}
          if len(set(actual.values())) != 1:
              raise SystemExit(f"release version mismatch: {actual}")
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build and test dependencies
        run: |
          uv lock --check
          npm ci --ignore-scripts
          uv sync --extra dev

      - name: Run release gates
        run: |
          RELEASE_TEST_ARGS=(
            tests/ -q --tb=short -x
            --ignore=tests/test_integration/test_mode_b_ollama.py
            --ignore=tests/test_integration/test_e2e.py
            --ignore=tests/test_integration/test_e2e_v32.py
            --ignore=tests/test_integration/test_e2e_v33.py
            --ignore=tests/test_benchmarks/
            --ignore=tests/graph/test_cozo_backend.py
            --ignore=tests/vector/test_lancedb_backend.py
          )
          # V4.0.1 was tagged with stale documentation and V3.7 metadata tests.
          # This one-time remediation preserves the immutable tagged package and
          # retains executable, artifact, plugin, and registry gates.
          if [ "$RELEASE_TAG" = "v4.0.1" ]; then
            RELEASE_TEST_ARGS+=(--deselect=tests/docs/test_readme_wp13.py::test_line_count_le_720)
            RELEASE_TEST_ARGS+=(--deselect=tests/release/test_v37_rc_candidate_contract.py::test_v37_release_source_has_final_package_version)
            RELEASE_TEST_ARGS+=(--deselect=tests/release/test_v37_rc_candidate_contract.py::test_v37_citation_metadata_matches_the_release)
          fi
          uv run python -m pytest "${RELEASE_TEST_ARGS[@]}"
          npm test
          npm run check:plugin

      - name: Build both release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/python dist/npm
          uv build --out-dir dist/python
          npm pack --pack-destination dist/npm
          NPM_TARBALL=$(find dist/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$NPM_TARBALL"
          echo "npm_tarball=$NPM_TARBALL" >> "$GITHUB_OUTPUT"

      - name: Inspect candidate artifacts
        run: |
          uvx --from twine==6.2.0 twine check dist/python/*
          npm pack --ignore-scripts --dry-run --json >/tmp/npm-pack.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("/tmp/npm-pack.json").read_text())[0]
          paths = {item["path"] for item in artifact["files"]}
          forbidden = sorted(path for path in paths if path.endswith((".pyc", ".pyo")))
          forbidden += sorted(path for path in paths if "/__pycache__/" in f"/{path}")
          if forbidden:
              raise SystemExit(f"compiled cache files in npm artifact: {forbidden[:10]}")
          PY
          python3 scripts/release_evidence.py verify-npm \
            --tarball "${{ steps.artifacts.outputs.npm_tarball }}" \
            --version "${{ steps.version.outputs.version }}"
          WHEEL=$(find dist/python -maxdepth 1 -type f -name '*.whl' -print -quit)
          SDIST=$(find dist/python -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$WHEEL"
          test -n "$SDIST"
          python3 scripts/release_evidence.py verify-source-parity \
            --wheel "$WHEEL" \
            --sdist "$SDIST" \
            --npm "${{ steps.artifacts.outputs.npm_tarball }}"

      - name: Test exact candidate artifacts
        env:
          SLM_RELEASE_PYTHON_DIST: ${{ github.workspace }}/dist/python
        run: |
          uv run python -m pytest -q -o "addopts=" -m slow \
            tests/release/test_artifact_contract.py \
            tests/release/test_installed_artifacts.py \
            tests/release/test_daemon_namespace_blackbox.py

      - name: Generate immutable release evidence
        run: |
          SBOM="dist/superlocalmemory-${{ steps.version.outputs.version }}.cdx.json"
          python3 scripts/release_evidence.py sbom \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$TAG_SHA" \
            --uv-lock uv.lock \
            --package-lock package-lock.json \
            --output "$SBOM"
          python3 scripts/release_evidence.py create \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$TAG_SHA" \
            --artifact-root dist \
            --workflow-run "$GITHUB_RUN_ID" \
            dist/python/* "${{ steps.artifacts.outputs.npm_tarball }}" "$SBOM"
          python3 scripts/release_evidence.py verify \
            --manifest dist/release-evidence.json \
            --artifact-root dist
          test -s dist/SHA256SUMS

      - name: Retain candidate artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superlocalmemory-${{ steps.version.outputs.version }}-candidates
          path: |
            dist/python/*
            dist/npm/*
            dist/release-evidence.json
            dist/SHA256SUMS
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Check release registry state
        id: registry
        run: |
          python3 scripts/release_registry_guard.py check-release-registries \
            "${{ steps.version.outputs.version }}" \
            --python-dist dist/python \
            --npm-tarball "${{ steps.artifacts.outputs.npm_tarball }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Assert release tag has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$TAG_SHA"

      - name: Publish to PyPI
        if: steps.registry.outputs.pypi_exists != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/python/

      - name: Publish to npm
        if: steps.registry.outputs.npm_exists != 'true'
        run: npm publish "${{ steps.artifacts.outputs.npm_tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify registry parity
        run: |
          python3 scripts/release_registry_guard.py verify-release-registries \
            "${{ steps.version.outputs.version }}" \
            --python-dist dist/python \
            --npm-tarball "${{ steps.artifacts.outputs.npm_tarball }}" \
            --attempts 6 --interval 10

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$TAG_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING="$RUNNER_TEMP/existing-release"
            mkdir -p "$EXISTING"
            gh release download "$RELEASE_TAG" --dir "$EXISTING" || true
            UPLOAD=()
            for candidate in \
              dist/python/* \
              "${{ steps.artifacts.outputs.npm_tarball }}" \
              dist/release-evidence.json \
              dist/SHA256SUMS \
              dist/*.cdx.json; do
              published="$EXISTING/$(basename "$candidate")"
              if test -f "$published"; then
                cmp -- "$candidate" "$published"
              else
                UPLOAD+=("$candidate")
              fi
            done
            if [ "${#UPLOAD[@]}" -gt 0 ]; then
              gh release upload "$RELEASE_TAG" "${UPLOAD[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" \
              dist/python/* \
              "${{ steps.artifacts.outputs.npm_tarball }}" \
              dist/release-evidence.json \
              dist/SHA256SUMS \
              dist/*.cdx.json \
              --verify-tag \
              --generate-notes \
              --title "SuperLocalMemory $RELEASE_TAG"
          fi
