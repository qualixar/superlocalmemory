<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1450" viewBox="0 0 900 1450" role="img" aria-labelledby="title desc"><title id="title">SLM local core and optional remote access, mobile overview</title><desc id="desc">SuperLocalMemory local core and optional authenticated web connection. The canonical memory database remains on the user’s machine; remote requests and results traverse the gateway.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa" /></marker></defs><rect width="900" height="1450" fill="#0b1020" /><rect width="900" height="1450" fill="url(#grid)" /><text x="38" y="64" fill="#f1f5f9" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">SuperLocalMemory</text><text x="38" y="109" fill="#f1f5f9" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Your memory. Local first.</text><rect x="28" y="188" width="844" height="720" rx="18" fill="#111a2d" stroke="#34d399" stroke-width="2" /><text x="55" y="235" fill="#34d399" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">FREE LOCAL CORE · YOUR MACHINE</text><path d="M450 366V410" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M275 619V668" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M686 668V619" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><rect x="55" y="267" width="790" height="100" rx="18" fill="#111a2d" stroke="#22d3ee" stroke-width="2" /><text x="79" y="309" fill="#22d3ee" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Local agents and interfaces</text><text x="79" y="339" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Claude Code · Codex · MCP · SDK · HTTP</text><rect x="55" y="410" width="790" height="210" rx="18" fill="#111a2d" stroke="#34d399" stroke-width="2" /><text x="79" y="452" fill="#34d399" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">SLM memory and knowledge engine</text><text x="79" y="482" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Remember · Recall · Corrections · Profiles</text><text x="79" y="515" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">SLM-Mesh · Cache · Compression · Graph</text><text x="79" y="548" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Optional answer check: Laya / Jev</text><text x="79" y="581" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Governance and learning</text><rect x="55" y="668" width="438" height="130" rx="18" fill="#111a2d" stroke="#a78bfa" stroke-width="2" /><text x="79" y="710" fill="#a78bfa" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Canonical local database</text><text x="79" y="740" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">SQLite + sqlite-vec</text><text x="79" y="773" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Memories stay here</text><rect x="520" y="668" width="325" height="130" rx="18" fill="#111a2d" stroke="#a78bfa" stroke-width="2" /><text x="544" y="710" fill="#a78bfa" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Optional connector</text><text x="544" y="740" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Outbound WSS</text><text x="544" y="773" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Off by default</text><text x="55" y="849" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Local use: no hosted account or subscription</text><rect x="28" y="950" width="844" height="330" rx="18" fill="#111a2d" stroke="#fbbf24" stroke-width="2" /><text x="55" y="999" fill="#fbbf24" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">OPTIONAL INTERNET CONNECTION</text><path d="M686 950V798" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><rect x="55" y="1030" width="790" height="185" rx="18" fill="#111a2d" stroke="#fbbf24" stroke-width="2" /><text x="79" y="1072" fill="#fbbf24" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Web clients → Cloudflare gateway</text><text x="79" y="1102" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Compatible web MCP clients</text><text x="79" y="1135" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">HTTPS + OAuth consent → outbound connector</text><text x="38" y="1330" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">No end-user Cloudflare setup.</text><text x="38" y="1376" fill="#b8c7de" font-size="23" font-family="Arial, Helvetica, sans-serif" font-weight="400">Payloads transit the gateway; database stays local.</text><text x="38" y="1410" fill="#b8c7de" font-size="23" font-family="Arial, Helvetica, sans-serif" font-weight="400">Your laptop must be online for remote access.</text><text x="38" y="150" fill="#b8c7de" font-size="23" font-family="Arial, Helvetica, sans-serif">Local core + optional web access</text></svg>