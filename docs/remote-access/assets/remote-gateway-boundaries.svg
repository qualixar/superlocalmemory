<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc"><title id="title">SLM remote connection: authorization and data boundaries</title><desc id="desc">SuperLocalMemory local core and optional authenticated web connection. The canonical memory database remains on the user’s machine; remote requests and results traverse the gateway.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa" /></marker></defs><rect width="1600" height="1020" fill="#0b1020" /><rect width="1600" height="1020" fill="url(#grid)" /><text x="50" y="72" fill="#f1f5f9" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">Remote access, local memory</text><rect x="30" y="175" width="450" height="670" rx="18" fill="#111a2d" stroke="#22d3ee" stroke-width="2" /><rect x="520" y="175" width="490" height="670" rx="18" fill="#111a2d" stroke="#fbbf24" stroke-width="2" /><rect x="1050" y="175" width="520" height="670" rx="18" fill="#111a2d" stroke="#34d399" stroke-width="2" /><text x="55" y="223" fill="#22d3ee" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">WEB CLIENT</text><text x="545" y="223" fill="#fbbf24" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">CLOUDFLARE SERVICE</text><text x="1075" y="223" fill="#34d399" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">USER’S LAPTOP</text><path d="M440 354H560" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M765 414V460" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M765 600V645" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M1090 362H1030V705H970" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M1320 440V480" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M1320 620V670" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><rect x="65" y="285" width="375" height="130" rx="18" fill="#111a2d" stroke="#22d3ee" stroke-width="2" /><text x="89" y="327" fill="#22d3ee" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Compatible MCP host</text><text x="89" y="357" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">HTTPS requests and results</text><text x="89" y="390" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Authorized memory access</text><rect x="65" y="490" width="375" height="190" rx="18" fill="#111a2d" stroke="#fb7185" stroke-width="2" /><text x="89" y="532" fill="#fb7185" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Owner authorization</text><text x="89" y="562" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Sign in and choose profile</text><text x="89" y="595" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Consent to read / save</text><text x="89" y="628" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Correction is separate</text><text x="89" y="661" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Revoke access anytime</text><rect x="560" y="285" width="410" height="130" rx="18" fill="#111a2d" stroke="#fbbf24" stroke-width="2" /><text x="584" y="327" fill="#fbbf24" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Public MCP Worker</text><text x="584" y="357" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">OAuth token verification</text><text x="584" y="390" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Discovery and routing</text><rect x="560" y="460" width="410" height="140" rx="18" fill="#111a2d" stroke="#fb7185" stroke-width="2" /><text x="584" y="502" fill="#fb7185" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Authoritative grant checks</text><text x="584" y="532" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Owner · Client · Profile · Tools</text><text x="584" y="565" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Current consent + entitlement</text><rect x="560" y="645" width="410" height="150" rx="18" fill="#111a2d" stroke="#fbbf24" stroke-width="2" /><text x="584" y="687" fill="#fbbf24" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Bound relay object</text><text x="584" y="717" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Device credential + generation</text><text x="584" y="750" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Hibernating WebSocket</text><text x="584" y="783" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">No canonical memory database</text><rect x="1090" y="285" width="440" height="155" rx="18" fill="#111a2d" stroke="#a78bfa" stroke-width="2" /><text x="1114" y="327" fill="#a78bfa" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">SLM dashboard + connector</text><text x="1114" y="357" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Opt-in and local enrollment</text><text x="1114" y="390" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Authenticated outbound WSS</text><text x="1114" y="423" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Reconnect; never replay writes</text><rect x="1090" y="480" width="440" height="140" rx="18" fill="#111a2d" stroke="#34d399" stroke-width="2" /><text x="1114" y="522" fill="#34d399" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Local MCP + memory engine</text><text x="1114" y="552" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Local installation authentication</text><text x="1114" y="585" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Existing governed write path</text><rect x="1090" y="670" width="440" height="125" rx="18" fill="#111a2d" stroke="#a78bfa" stroke-width="2" /><text x="1114" y="712" fill="#a78bfa" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Canonical local storage</text><text x="1114" y="742" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">SQLite + sqlite-vec</text><text x="1114" y="775" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Existing local clients still work</text><text x="50" y="895" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">HTTPS is the public MCP transport. WSS is the private laptop relay transport.</text><text x="50" y="947" fill="#b8c7de" font-size="23" font-family="Arial, Helvetica, sans-serif" font-weight="400">Remote requests/results pass through Cloudflare. Cloud storage holds connection and authorization state.</text><text x="50" y="987" fill="#b8c7de" font-size="23" font-family="Arial, Helvetica, sans-serif" font-weight="400">Laptop sleep/offline → remote unavailable. Gateway outage/revocation → local SLM remains usable.</text><text x="50" y="116" font-size="25" font-family="Arial, Helvetica, sans-serif" fill="#b8c7de">HTTPS MCP for web clients · Authenticated outbound connection from your machine</text></svg>