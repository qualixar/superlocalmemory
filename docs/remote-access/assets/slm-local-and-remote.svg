<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">SuperLocalMemory: local core and optional remote access</title><desc id="desc">SuperLocalMemory local core and optional authenticated web connection. The canonical memory database remains on the user’s machine; remote requests and results traverse the gateway.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa" /></marker></defs><rect width="1600" height="1050" fill="#0b1020" /><rect width="1600" height="1050" fill="url(#grid)" /><text x="55" y="72" fill="#f1f5f9" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">One memory. Your agents. Your machine.</text><text x="55" y="107" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">SuperLocalMemory • Free local core + optional internet connection</text><rect x="40" y="190" width="960" height="730" rx="18" fill="#111a2d" stroke="#34d399" stroke-width="2" /><rect x="1040" y="190" width="520" height="730" rx="18" fill="#111a2d" stroke="#fbbf24" stroke-width="2" /><text x="70" y="235" fill="#34d399" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">YOUR MACHINE · FREE LOCAL CORE</text><text x="1070" y="235" fill="#fbbf24" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">OPTIONAL REMOTE SERVICE</text><path d="M520 380V435" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M340 655V735" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M800 735V655" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M1300 380V435" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M1300 575V630" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><path d="M960 795H1020V710H1080" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)" /><rect x="80" y="270" width="880" height="110" rx="18" fill="#111a2d" stroke="#22d3ee" stroke-width="2" /><text x="104" y="312" fill="#22d3ee" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Local agents and developer interfaces</text><text x="104" y="342" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Claude Code · Codex · MCP clients · Python SDK · HTTP API</text><rect x="80" y="435" width="880" height="220" rx="18" fill="#111a2d" stroke="#34d399" stroke-width="2" /><text x="104" y="477" fill="#34d399" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">SLM memory and knowledge engine</text><text x="104" y="507" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Remember · Recall · Corrections · Profiles and scopes</text><text x="104" y="540" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">SLM-Mesh coordination · Context cache and compression</text><text x="104" y="573" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Answer check: Laya (local) / Jev (online), when enabled</text><text x="104" y="606" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Governed writes · Learning · Knowledge graph</text><rect x="80" y="735" width="520" height="120" rx="18" fill="#111a2d" stroke="#a78bfa" stroke-width="2" /><text x="104" y="777" fill="#a78bfa" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Canonical local database</text><text x="104" y="807" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">SQLite + sqlite-vec</text><text x="104" y="840" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Memories remain on your machine</text><rect x="640" y="735" width="320" height="120" rx="18" fill="#111a2d" stroke="#a78bfa" stroke-width="2" /><text x="664" y="777" fill="#a78bfa" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Optional connector</text><text x="664" y="807" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Outbound WSS</text><text x="664" y="840" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Off by default</text><rect x="1080" y="270" width="440" height="110" rx="18" fill="#111a2d" stroke="#22d3ee" stroke-width="2" /><text x="1104" y="312" fill="#22d3ee" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Web agents and bots</text><text x="1104" y="342" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Compatible HTTP MCP clients</text><rect x="1080" y="435" width="440" height="140" rx="18" fill="#111a2d" stroke="#fb7185" stroke-width="2" /><text x="1104" y="477" fill="#fb7185" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Identity and consent</text><text x="1104" y="507" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">HTTPS MCP + OAuth</text><text x="1104" y="540" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Profile, tool and scope permissions</text><rect x="1080" y="630" width="440" height="120" rx="18" fill="#111a2d" stroke="#fbbf24" stroke-width="2" /><text x="1104" y="672" fill="#fbbf24" font-size="29" font-family="Arial, Helvetica, sans-serif" font-weight="700">Cloudflare gateway</text><text x="1104" y="702" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Worker + Durable Object relay</text><text x="1104" y="735" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Connection state; no memory DB</text><text x="55" y="958" fill="#f1f5f9" font-size="25" font-family="Arial, Helvetica, sans-serif" font-weight="400">Local use needs no hosted account. Remote opt-in does not replace local integrations.</text><text x="55" y="1008" fill="#b8c7de" font-size="23" font-family="Arial, Helvetica, sans-serif" font-weight="400">Remote payloads traverse the gateway • Laptop must be online • No user Cloudflare setup</text><text x="55" y="154" fill="#b8c7de" font-size="23" font-family="Arial, Helvetica, sans-serif">One canonical engine · Local and web access</text></svg>